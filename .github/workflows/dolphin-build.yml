name: Dolphin build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Server profile (dolphin/profiles/<name>.json)"
        type: choice
        options: [dev, production]
        default: dev
      builds:
        description: "dev only: which apps to build (production always builds all three)"
        type: choice
        options: [customer-x64, technician-x64, customer-x86, x64, all]
        default: customer-x64
      release-tag:
        description: "production only: publish a release tagged vX.Y.Z or vX.Y.Z-rc.N (X.Y.Z = dolphin/version.txt); empty = artifact only"
        type: string
        default: ""

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  # vcpkg removed its GitHub Actions cache backend, so every Windows job rebuilt ffmpeg, aom and 14 other libraries (~15 min,
  # run 40498394513, TB-1). The `files` backend writes one zip per package here; actions/cache keeps the folder.
  VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-binary-cache,readwrite'
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # RustDesk's own version stays crate::VERSION (the protocol compares it); ours is dolphin/version.txt (TB-4).
  UPSTREAM_VERSION: "1.5.0"
  # 32-bit Sciter runtime for the x86 build, pinned to the last commit that changed it (2022-01-01).
  SCITER_DLL_URL: "https://github.com/c-smile/sciter-sdk/raw/1c6b588cd090506d4b044dead06d7eae6e2235b7/bin.win/x32/sciter.dll"
  SCITER_DLL_SHA256: "285f3e6a051a7c61845cd7e4d2120781b6bdf411239f70a85c65b38a52d38f28"

jobs:
  # The fast checks (Python tests, profile and rebrand checks, std-only Rust tests). The bridge and the Dart analysis
  # run below as their own jobs, so the Windows builds wait for the bridge only, not for the analysis.
  check:
    uses: ./.github/workflows/dolphin-check.yml
    with:
      profile: ${{ inputs.profile }}
      fast-only: true

  bridge:
    uses: ./.github/workflows/bridge.yml

  analyze-and-test:
    needs: bridge
    uses: ./.github/workflows/dolphin-analyze.yml
    with:
      profile: ${{ inputs.profile }}

  guard:
    runs-on: ubuntu-latest
    outputs:
      x64: ${{ steps.plan.outputs.x64 }}
      x86: ${{ steps.plan.outputs.x86 }}
      version: ${{ steps.plan.outputs.version }}
      file_version: ${{ steps.plan.outputs.file_version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Apps and version (production builds all three; a tag must match dolphin/version.txt)
        id: plan
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          BUILDS: ${{ inputs.builds }}
          TAG: ${{ inputs.release-tag }}
        run: python dolphin/build_plan.py plan --profile "$PROFILE" --builds "$BUILDS" --tag "$TAG" --run "${{ github.run_number }}" | tee -a "$GITHUB_OUTPUT"

  build-windows:
    needs: [check, guard, bridge]
    if: needs.guard.outputs.x64 != '[]'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.guard.outputs.x64) }}
    env:
      DOLPHIN_VERSION: ${{ needs.guard.outputs.version }}
      DOLPHIN_FILE_VERSION: ${{ needs.guard.outputs.file_version }}
      # The portal derives these names: DolphinConnect-<version>-x64.exe, DolphinConnect-Technician-<version>-x64.exe.
      OUT_NAME: ${{ matrix.variant == 'technician' && 'DolphinConnect-Technician' || 'DolphinConnect' }}
      APP_EXE: ${{ matrix.variant == 'technician' && 'DolphinConnectTech.exe' || 'DolphinConnect.exe' }}
      # Brotli quality for the portable packer: 5 is much faster for dev builds; production keeps 11 (generate.py's
      # default). The packer's decoder reads any quality.
      PACK_LEVEL: ${{ inputs.profile == 'dev' && '5' || '11' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Dolphin settings, version and branding
        shell: bash
        env:
          # D21: the fixed password, only for this step; gen_profile.py writes it obfuscated to a git-ignored file and
          # never prints it. A production build fails without it.
          DOLPHIN_FIXED_PASSWORD: ${{ secrets.DOLPHIN_FIXED_PASSWORD }}
        run: |
          pip install pillow==11.3.0
          python dolphin/gen_profile.py "${{ inputs.profile }}" "${{ matrix.variant }}" "$DOLPHIN_VERSION"
          python dolphin/build_plan.py pubspec --run "${{ github.run_number }}"
          python dolphin/brand.py
          python dolphin/rebrand.py

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      # Before rust-cache: it puts CARGO_* variables into its key, so dev and production keep separate caches.
      - name: Faster Rust profile for dev builds (production keeps full LTO and one codegen unit)
        if: inputs.profile == 'dev'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg binary cache (zips kept between runs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
          restore-keys: |
            vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          mkdir -p /c/vcpkg-binary-cache
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee "$RUNNER_TEMP/vcpkg.log"
          grep -iE "restored [0-9]+ package|stored binar|binary cach" "$RUNNER_TEMP/vcpkg.log" || true

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # The portable packer extracts into a folder named after this exe; keep it apart from stock RustDesk.
          mv ./rustdesk/rustdesk.exe "./rustdesk/$env:APP_EXE"

      # DD-41: upstream's remote-printer driver (drivers\RustDeskPrinterDriver) and its adapter DLL, laid out as
      # upstream 1.5.0's flutter-build.yml does, for the customer app only (the technician prints with Windows' own
      # spooler). Pinned by SHA-256 (from upstream's sha256sums, checked 2026-11-13); unlike upstream, a changed file
      # fails the build. The driver is installed on a PC only by «نصب چاپگر» (UAC) or an install with the printer
      # option, and print jobs leave the PC only when the portal's `remote-printer` switch is not hidden.
      - name: Remote printer driver (DD-41)
        if: matrix.variant == 'customer'
        shell: bash
        env:
          PRINTER_DRIVER_URL: https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip
          PRINTER_DRIVER_SHA256: c4cf4d3b48c4d9079b243edc43bb1db03b076282bc259c9f49883e9db20fa8b5
          PRINTER_ADAPTER_URL: https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip
          PRINTER_ADAPTER_SHA256: e90e5d52c8807b4c6293c78a52479338715e0bf396b1b34802777b8c452e6781
        run: |
          mkdir -p printer-dl
          curl -fsSL -o printer-dl/driver.zip "$PRINTER_DRIVER_URL"
          curl -fsSL -o printer-dl/adapter.zip "$PRINTER_ADAPTER_URL"
          echo "$PRINTER_DRIVER_SHA256  printer-dl/driver.zip" | sha256sum -c -
          echo "$PRINTER_ADAPTER_SHA256  printer-dl/adapter.zip" | sha256sum -c -
          python -c "import zipfile; [zipfile.ZipFile(f'printer-dl/{n}.zip').extractall(f'printer-dl/{n}') for n in ('driver', 'adapter')]"
          mkdir -p ./rustdesk/drivers
          mv printer-dl/driver/rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
          mv printer-dl/adapter/printer_driver_adapter.dll ./rustdesk/
          test -f ./rustdesk/drivers/RustDeskPrinterDriver/RustDeskPrinterDriver.inf

      # DD-21: a clean Windows 10 without the VC++ redistributable must start the app. Rust and the runner are built
      # with the static runtime (upstream); this copies any VC++ runtime DLL a prebuilt DLL next to the exe imports
      # (flutter_windows.dll, the printer adapter) from Visual Studio's redist folder, and fails if one is missing.
      - name: VC++ runtime next to the app (DD-21)
        shell: bash
        run: python dolphin/vcruntime.py bundle ./rustdesk --arch x64

      - name: Copy Runner.res for the portable packer
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          test -n "$runner_res" && cp "$runner_res" ./libs/portable/Runner.res

      - name: Portable exe and checksums
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -l "$PACK_LEVEL" -e "../../rustdesk/${APP_EXE}"
          popd
          mkdir -p out
          mv ./target/release/rustdesk-portable-packer.exe "out/${OUT_NAME}-${DOLPHIN_VERSION}-x64.exe"
          cp dolphin/build/baked-settings.json out/
          cd out && sha256sum *.exe && ls -l

      - name: Version resource (TB-4)
        shell: pwsh
        run: |
          $outer = Get-Item "out/$env:OUT_NAME-$env:DOLPHIN_VERSION-x64.exe"
          $inner = Get-Item "rustdesk/$env:APP_EXE"
          $outer.VersionInfo, $inner.VersionInfo | Format-List FileName, FileVersion, ProductVersion, ProductName, FileDescription
          if ($outer.VersionInfo.FileVersion -ne $env:DOLPHIN_FILE_VERSION) { throw "outer FileVersion '$($outer.VersionInfo.FileVersion)', expected '$env:DOLPHIN_FILE_VERSION'" }
          if ($outer.VersionInfo.ProductVersion -ne $env:DOLPHIN_VERSION) { throw "outer ProductVersion '$($outer.VersionInfo.ProductVersion)', expected '$env:DOLPHIN_VERSION'" }
          $n = $env:DOLPHIN_FILE_VERSION.Split('.')
          if ($inner.VersionInfo.FileMajorPart -ne [int]$n[0] -or $inner.VersionInfo.FilePrivatePart -ne [int]$n[3]) { throw "inner exe FileVersion numbers are not $env:DOLPHIN_FILE_VERSION (pubspec version)" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dolphin-connect-${{ inputs.profile }}-${{ matrix.variant }}-x64
          path: out/

  # Customer build for Windows 7/8 and 32-bit Windows. Adapted from upstream 1.5.0 `build-for-windows-sciter`:
  # no signing, no virtual-display driver, our generator and branding, sciter.dll pinned by commit and SHA-256.
  build-windows-x86:
    needs: [check, guard]
    if: needs.guard.outputs.x86 == 'true'
    runs-on: windows-2022
    env:
      DOLPHIN_VERSION: ${{ needs.guard.outputs.version }}
      DOLPHIN_FILE_VERSION: ${{ needs.guard.outputs.file_version }}
      PACK_LEVEL: ${{ inputs.profile == 'dev' && '5' || '11' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Dolphin settings, version and branding
        shell: bash
        env:
          DOLPHIN_FIXED_PASSWORD: ${{ secrets.DOLPHIN_FIXED_PASSWORD }}
        run: |
          pip install pillow==11.3.0
          python dolphin/gen_profile.py "${{ inputs.profile }}" customer "$DOLPHIN_VERSION"
          python dolphin/brand.py
          python dolphin/rebrand.py

      - name: Install LLVM and Clang (32-bit)
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # upstream 1.5.0 pin
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Sciter's abi_thiscall feature needs nightly; an i686 host toolchain loads the 32-bit LLVM (upstream 1.5.0).
          rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc \
            --target i686-pc-windows-msvc --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

      - name: Faster Rust profile for dev builds (production keeps full LTO and one codegen unit)
        if: inputs.profile == 'dev'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=off" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-sciter

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: vcpkg binary cache (zips kept between runs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-bin-x86-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
          restore-keys: |
            vcpkg-bin-x86-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        shell: bash
        run: |
          mkdir -p /c/vcpkg-binary-cache
          $VCPKG_ROOT/vcpkg install --triplet x86-windows-static --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee "$RUNNER_TEMP/vcpkg.log"
          grep -iE "restored [0-9]+ package|stored binar|binary cach" "$RUNNER_TEMP/vcpkg.log" || true

      - name: Build (Sciter, 32-bit)
        shell: bash
        run: |
          python3 res/inline-sciter.py
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/DolphinConnect.exe
          curl -fsSL -o ./Release/sciter.dll "$SCITER_DLL_URL"
          echo "$SCITER_DLL_SHA256  ./Release/sciter.dll" | sha256sum -c -

      # DD-21: as in the x64 job (Windows 7 and 8.1 also need the Universal CRT, update KB2999226, if a DLL imports it).
      - name: VC++ runtime next to the app (DD-21)
        shell: bash
        run: python dolphin/vcruntime.py bundle ./Release --arch x86

      - name: Portable exe and checksum
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -l "$PACK_LEVEL" -e ../../Release/DolphinConnect.exe
          popd
          mkdir -p out
          mv ./target/release/rustdesk-portable-packer.exe "out/DolphinConnect-${DOLPHIN_VERSION}-x86.exe"
          cd out && sha256sum *.exe && ls -l

      - name: Version resource (TB-4)
        shell: pwsh
        run: |
          $outer = Get-Item "out/DolphinConnect-$env:DOLPHIN_VERSION-x86.exe"
          $inner = Get-Item "Release/DolphinConnect.exe"
          $outer.VersionInfo, $inner.VersionInfo | Format-List FileName, FileVersion, ProductVersion, ProductName, FileDescription
          foreach ($exe in @($outer, $inner)) {
            if ($exe.VersionInfo.FileVersion -ne $env:DOLPHIN_FILE_VERSION) { throw "$($exe.Name) FileVersion '$($exe.VersionInfo.FileVersion)', expected '$env:DOLPHIN_FILE_VERSION'" }
            if ($exe.VersionInfo.ProductVersion -ne $env:DOLPHIN_VERSION) { throw "$($exe.Name) ProductVersion '$($exe.VersionInfo.ProductVersion)', expected '$env:DOLPHIN_VERSION'" }
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dolphin-connect-${{ inputs.profile }}-customer-x86
          path: out/

  release:
    needs: [guard, check, analyze-and-test, build-windows, build-windows-x86]
    if: inputs.profile == 'production' && inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Portal ADR-0014: the exes also go to the public ghcr.io package the portal fetches them from.
      packages: write
    env:
      TAG: ${{ inputs.release-tag }}
      DOLPHIN_VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dolphin-connect-production-*
          path: out
          merge-multiple: true
      - name: Checksums and expected files
        run: |
          cd out
          v="$DOLPHIN_VERSION"
          for f in "DolphinConnect-$v-x64.exe" "DolphinConnect-$v-x86.exe" "DolphinConnect-Technician-$v-x64.exe" baked-settings.json; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          sha256sum *.exe | tee SHA256SUMS
          ls -l
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flag=""
          if [ "$PRERELEASE" = "true" ]; then flag="--prerelease"; fi
          gh release create "$TAG" out/* $flag \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Dolphin Connect $DOLPHIN_VERSION" \
            --notes "Windows apps, Dolphin Connect $DOLPHIN_VERSION (RustDesk ${UPSTREAM_VERSION} with the changes in dolphin/README.md): customer x64, customer x86 (Windows 7/8 and 32-bit), technician x64. Unsigned. Verify with SHA256SUMS. Changes: dolphin/CHANGELOG.md."
      # Portal ADR-0014: the same three exes on ghcr.io, one raw layer each, so a blob's digest is the file's SHA-256 and
      # the portal fetches exactly what its pin (app/client/release.json) names. The package is public (free); the owner
      # sets it public once after the first push.
      - name: Install oras (pinned, checksum checked)
        env:
          ORAS_VERSION: "1.3.6"
          ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        run: |
          curl -fsSL -o oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras" && tar -xzf oras.tar.gz -C "$RUNNER_TEMP/oras" oras
          echo "$RUNNER_TEMP/oras" >> "$GITHUB_PATH"
      - name: Push the exes to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dolphin-connect-client-files"
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd out
          v="$DOLPHIN_VERSION"
          type=application/vnd.microsoft.portable-executable
          oras push "$repo:$v" --artifact-type application/vnd.dolphin.connect.client.v1 \
            "DolphinConnect-$v-x64.exe:$type" "DolphinConnect-$v-x86.exe:$type" "DolphinConnect-Technician-$v-x64.exe:$type"
          # Every pushed layer must be the exact file the release lists in SHA256SUMS.
          oras manifest fetch "$repo:$v" | jq -r '.layers[] | "\(.digest | sub("^sha256:"; ""))  \(.annotations["org.opencontainers.image.title"])"' | sort > pushed.txt
          grep '\.exe$' SHA256SUMS | sed 's/ \*/  /' | sort > expected.txt
          diff -u expected.txt pushed.txt
          echo "pushed $repo:$v"
