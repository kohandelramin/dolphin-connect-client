name: Dolphin build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Server profile (dolphin/profiles/<name>.json)"
        type: choice
        options: [dev, production]
        default: dev
      release-tag:
        description: "production only: publish a release with this tag (1.5.0-dc.N); empty = artifact only"
        type: string
        default: ""

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  UPSTREAM_VERSION: "1.5.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unit tests and profile check
        run: |
          pip install pillow==11.3.0
          python -m unittest discover -s dolphin -p "test_*.py" -v
          python dolphin/gen_profile.py "${{ inputs.profile }}"
      - name: Refuse a release that is not production
        if: inputs.release-tag != '' && inputs.profile != 'production'
        run: |
          echo "Releases are production builds only." >&2
          exit 1
      - name: Release tag format
        if: inputs.release-tag != ''
        run: |
          [[ "${{ inputs.release-tag }}" =~ ^${UPSTREAM_VERSION//./\\.}-dc\.[0-9]+$ ]] || { echo "tag must be ${UPSTREAM_VERSION}-dc.N" >&2; exit 1; }

  generate-bridge:
    needs: test
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: [test, generate-bridge]
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.release-tag != '' && inputs.release-tag || format('{0}-{1}', 'dev', github.run_number) }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Dolphin settings and branding
        shell: bash
        run: |
          pip install pillow==11.3.0
          python dolphin/gen_profile.py "${{ inputs.profile }}"
          python dolphin/brand.py

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # The portable packer extracts into a folder named after this exe; keep it apart from stock RustDesk.
          mv ./rustdesk/rustdesk.exe ./rustdesk/DolphinConnect.exe

      - name: Copy Runner.res for the portable packer
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          test -n "$runner_res" && cp "$runner_res" ./libs/portable/Runner.res

      - name: Portable exe and checksums
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/DolphinConnect.exe
          popd
          mkdir -p out
          mv ./target/release/rustdesk-portable-packer.exe "out/DolphinConnect-${VERSION}-x86_64.exe"
          cp dolphin/build/baked-settings.json out/
          cd out && sha256sum "DolphinConnect-${VERSION}-x86_64.exe" | tee SHA256SUMS && ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dolphin-connect-${{ inputs.profile }}
          path: out/

  release:
    needs: build-windows
    if: inputs.profile == 'production' && inputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dolphin-connect-production
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release-tag }}" out/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Dolphin Connect ${{ inputs.release-tag }}" \
            --notes "Windows x64 portable client, RustDesk ${UPSTREAM_VERSION} with the changes in dolphin/README.md. Unsigned. Verify with SHA256SUMS."
