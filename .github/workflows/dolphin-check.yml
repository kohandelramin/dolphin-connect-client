name: Dolphin check

# Fast checks without a Windows build (about 5 minutes): Python tests, profile and rebrand checks, the bridge, Dart
# analyze and widget tests. Runs on every push to `dolphin`; the Dolphin build calls it first, so a release runs
# exactly the same checks (TB-1).
on:
  push:
    branches: [dolphin]
  workflow_call:
    inputs:
      profile:
        type: string
        default: dev
      # The build workflow generates the bridge itself and runs the Dart analysis beside the Windows builds, so
      # it asks for the fast jobs only. A push runs everything.
      fast-only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile || 'dev' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unit tests and profile check
        run: |
          pip install pillow==11.3.0
          python -m unittest discover -s dolphin -p "test_*.py" -v
          v="$(cat dolphin/version.txt)-dev.${{ github.run_number }}"
          python dolphin/gen_profile.py "$PROFILE" customer "$v"
          python dolphin/gen_profile.py "$PROFILE" technician "$v"
      - name: No visible RustDesk text or links (fails early, before the long builds)
        run: python dolphin/rebrand.py

  # Files with no crate dependencies are tested with plain rustc: the full crate needs vcpkg and a Windows runner.
  rust-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Std-only Rust tests
        shell: bash
        run: |
          rustc --version
          rustc --edition 2021 --test dolphin/version_resource.rs -o "$RUNNER_TEMP/version_resource"
          "$RUNNER_TEMP/version_resource"
          rustc --edition 2021 --test src/dolphin_update_core.rs -o "$RUNNER_TEMP/update_core"
          "$RUNNER_TEMP/update_core"
          rustc --edition 2021 --test libs/portable/src/dolphin_wait.rs -o "$RUNNER_TEMP/dolphin_wait"
          "$RUNNER_TEMP/dolphin_wait"
          rustc --edition 2021 --test src/dolphin_portal.rs -o "$RUNNER_TEMP/dolphin_portal"
          "$RUNNER_TEMP/dolphin_portal"

  generate-bridge:
    if: ${{ !inputs.fast-only }}
    needs: test
    uses: ./.github/workflows/bridge.yml

  # Dart has no local toolchain here: the Dolphin screens are analyzed and widget-tested in CI.
  analyze-and-test:
    if: ${{ !inputs.fast-only }}
    needs: [test, generate-bridge]
    uses: ./.github/workflows/dolphin-analyze.yml
    with:
      profile: ${{ inputs.profile || 'dev' }}
